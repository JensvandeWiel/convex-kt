# Gradle daemon tuning. The KMP build graph (Android + JVM + three Apple targets)
# is memory hungry, so the heap is raised above the Gradle default.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin
kotlin.code.style=official

# Apple targets are declared on every host so the source-set hierarchy is
# identical everywhere, but they are disabled automatically on non-macOS hosts.
# This flag keeps that expected condition out of the build log as an error.
kotlin.native.ignoreDisabledTargets=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
