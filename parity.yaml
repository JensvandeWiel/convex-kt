# Machine-readable parity manifest.
#
# Every upstream `convex-rs` test must have a Kotlin counterpart listed here.
# `:tools:parity` validates this file in CI; see the "Full Test-Suite Parity"
# rule in AGENTS.md and the `check-parity` skill.
#
# Per-requirement fields:
#   id           stable, unique identifier
#   description  what the test proves, in one sentence
#   status       planned | ported | not-applicable
#   upstream     references into the convex-rs submodule (third_party/convex-rs)
#   kotlin       references into this repository
#
# Upstream revision: third_party/convex-rs @ a4d04a9f4990078693760c2a08d0032323aa7f1b

schemaVersion: 1

requirements:
  - id: value/u64-roundtrip
    description: >
      64-bit unsigned integers survive serialization without precision loss.
      The wire format is double-quoted little-endian base64, not a JSON number,
      which is the single most likely place a port silently corrupts data.
    status: planned
    upstream:
      - sync_types/src/types/json.rs::proptest_u64_roundtrips

  - id: value/empty-array-roundtrip
    description: An empty Convex array round-trips through the codec unchanged.
    status: planned
    upstream:
      - sync_types/src/types/json.rs::test_empty_array_roundtrips

  - id: protocol/connect-frame-shape
    description: >
      The Connect frame carries sessionId (a UUID), connectionCount, and
      lastCloseReason, and the pinned backend answers it with a Ping. Recorded
      as conformance fixture connect-handshake.
    status: ported
    upstream:
      - sync_types/src/types/mod.rs::ClientMessage
    kotlin:
      - conformance/fixtures/connect-handshake

  - id: client/deployment-url
    description: A deployment URL is normalized into the sync WebSocket URL.
    status: planned
    upstream:
      - src/client/mod.rs::test_deployment_url

  - id: value/value-roundtrip
    description: Arbitrary Convex values round-trip through the JSON codec.
    status: planned
    upstream:
      - src/value/json/mod.rs::test_value_roundtrips

  - id: types/udf-path-roundtrip
    description: A UDF path round-trips through its serialized form.
    status: planned
    upstream:
      - sync_types/src/udf_path.rs::test_udf_path_roundtrips
