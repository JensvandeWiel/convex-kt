name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wrapper-validation:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4

  build:
    name: Build and test (${{ matrix.os }})
    needs: wrapper-validation
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # macOS additionally compiles and links the Apple targets; the other two
      # hosts build Android + JVM. `kotlin.native.ignoreDisabledTargets` keeps
      # the non-Apple hosts quiet.
      - name: Build and test
        shell: bash
        run: ./gradlew build --stacktrace --console=plain

  quality:
    name: Quality gates
    needs: wrapper-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Formatting, static analysis, and the published-API surface are checked
      # as separate steps so a failure names the pillar that broke.
      - name: Spotless (formatting)
        run: ./gradlew spotlessCheck --console=plain
      - name: Detekt (static analysis, incl. AGENTS.md guardrails)
        run: ./gradlew detekt --console=plain
      - name: API compatibility
        run: ./gradlew apiCheck --console=plain
      - name: Coverage floor
        run: ./gradlew koverVerify --console=plain
      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis
          path: |
            **/build/reports/detekt/*.html
            **/build/reports/detekt/*.sarif
            **/build/reports/kover/**
          if-no-files-found: ignore
          retention-days: 7

  parity:
    name: Parity gate
    needs: wrapper-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate parity coverage against upstream
        run: ./gradlew :tools:parity:run --args="--upstream third_party/convex-rs"

  conformance:
    name: Conformance fixtures
    needs: wrapper-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Boots the pinned backend (SQLite) and re-records the committed fixtures,
      # then fails if they changed. This is the real-backend check: it never
      # substitutes mocked server responses.
      - name: Start pinned backend
        run: docker compose -f conformance/docker-compose.yml up -d --wait --force-recreate
      - name: Record fixtures
        working-directory: conformance/harness
        run: |
          npm ci
          ADMIN_KEY="$(docker exec "$(docker compose -f ../docker-compose.yml ps -q backend)" ./generate_admin_key.sh | tail -n1)"
          node record-handshake.mjs --url http://127.0.0.1:3210 --admin-key "$ADMIN_KEY"
          node record-subscription.mjs --url http://127.0.0.1:3210 --admin-key "$ADMIN_KEY"
      - name: Fail on fixture drift
        run: git diff --exit-code -- conformance/fixtures
      - name: Tear down
        if: always()
        run: docker compose -f conformance/docker-compose.yml down -v

  # Additional conformance scenarios are added alongside the protocol features
  # they cover; each gets its own fixture directory and recorder.
